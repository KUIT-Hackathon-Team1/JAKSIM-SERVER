services:
  mysql:
    image: mysql:8.0
    container_name: jaksim-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass1234
      MYSQL_DATABASE: jaksim
      MYSQL_USER: jaksim
      MYSQL_PASSWORD: jaksim1234
      TZ: Asia/Seoul
    ports:
      - "3307:3306"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - jaksim_mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: jaksim-server
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/jaksim?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: jaksim
      SPRING_DATASOURCE_PASSWORD: jaksim1234

volumes:
  jaksim_mysql_data:

